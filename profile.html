<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料設定 - 托育資訊整合平台</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .user-layout {
            display: flex;
            max-width: 1200px;
            margin: 40px auto;
            gap: 30px;
            padding: 0 20px;
        }
        .user-sidebar {
            width: 250px;
            background-color: #fff;
            border: 2px solid #ccc;
            height: fit-content;
        }
        .user-profile-summary {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #eee;
        }
        .avatar-placeholder {
            width: 80px;
            height: 80px;
            background-color: #ccc;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        .user-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .user-menu li {
            border-bottom: 1px solid #eee;
        }
        .user-menu a {
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .user-menu a:hover,
        .user-menu a.active {
            background-color: #eaeaea;
            border-left: 4px solid #666;
        }
        .user-main {
            flex-grow: 1;
        }
        .welcome-header {
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ccc;
        }
        .text-line {
            color: #666;
            font-size: 14px;
        }
        .profile-section {
            background: #fff;
            border: 2px solid #ccc;
            padding: 25px;
            margin-bottom: 30px;
        }
        .profile-section h3 {
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            font-size: 16px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn-save {
            background-color: #666;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-save:hover {
            background-color: #444;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .recommendation-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .rec-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
        }
        .rec-card h4 {
            margin: 0 0 8px 0;
        }
        .rec-card .detail {
            font-size: 13px;
            color: #666;
        }
        .no-data {
            text-align: center;
            padding: 30px;
            color: #999;
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="index.html" style="text-decoration: none;">
        <div class="logo-placeholder">托育整合平台</div>
    </a>
    <div class="nav-actions">
        <span id="nav-user-name">👋 你好，家長</span>
        <a href="index.html" class="wireframe-btn" style="text-decoration:none;">回首頁</a>
        <button class="wireframe-btn primary" onclick="logout()">登出</button>
    </div>
</header>

<div class="user-layout">
    <aside class="user-sidebar">
        <div class="user-profile-summary">
            <div class="avatar-placeholder">大頭貼</div>
            <h3 id="user-name-display"></h3>
            <div id="user-email-display" class="text-line"></div>
        </div>
        <ul class="user-menu">
            <li><a href="user.html">🏠 會員首頁概況</a></li>
            <li><a href="profile.html" class="active">👤 個人資料設定</a></li>
            <li><a href="favorite.html">📁 我的收藏清單</a></li>
            <li><a href="my-reviews.html">📝 我的評價紀錄</a></li>
        </ul>
    </aside>

    <main class="user-main">
        <div class="welcome-header">
            <h2>👤 個人資料設定</h2>
            <p class="text-line">您可以在這裡修改您的姓名、電子郵件與聯絡電話。</p>
        </div>

        <!-- 基本資料修改區塊（含電話） -->
        <div class="profile-section">
            <h3>📋 基本資料</h3>
            <form id="profile-form">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="name" name="name" required placeholder="請輸入您的姓名">
                </div>
                <div class="form-group">
                    <label>電子郵件</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>聯絡電話</label>
                    <input type="tel" id="phone" name="phone" placeholder="0912345678">
                </div>
                <button type="submit" class="btn-save">儲存基本資料</button>
                <div id="basic-message"></div>
            </form>
        </div>

        <!-- 托育偏好設定區塊（保持原有） -->
        <div class="profile-section">
            <h3>✨ 托育偏好設定</h3>
            <p class="text-line">設定您的偏好後，我們會為您推薦最適合的托育機構，並顯示在下方。</p>
            <form id="preference-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>偏好行政區</label>
                        <select id="pref-district">
                            <option value="">全部區域</option>
                            <option value="中正區">中正區</option>
                            <option value="大同區">大同區</option>
                            <option value="中山區">中山區</option>
                            <option value="松山區">松山區</option>
                            <option value="大安區">大安區</option>
                            <option value="萬華區">萬華區</option>
                            <option value="信義區">信義區</option>
                            <option value="士林區">士林區</option>
                            <option value="北投區">北投區</option>
                            <option value="內湖區">內湖區</option>
                            <option value="南港區">南港區</option>
                            <option value="文山區">文山區</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>機構類別</label>
                        <select id="pref-category">
                            <option value="">全部</option>
                            <option value="托嬰中心">托嬰中心</option>
                            <option value="幼兒園">幼兒園</option>
                            <option value="托育資源中心">托育資源中心</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>評鑑等級 (最低要求)</label>
                        <select id="pref-evaluation">
                            <option value="">不限</option>
                            <option value="優等">優等</option>
                            <option value="甲等">甲等</option>
                            <option value="乙等">乙等</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>延托服務需求</label>
                        <select id="pref-extended">
                            <option value="">不拘</option>
                            <option value="true">需要延托服務</option>
                            <option value="false">不需要延托</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-save">儲存偏好並更新推薦</button>
                <div id="pref-message"></div>
            </form>

            <!-- 推薦機構區塊 -->
            <div style="margin-top: 30px;">
                <h4>🎯 為您推薦的機構</h4>
                <div id="recommend-list" class="recommendation-grid">
                    <div class="no-data">請先設定偏好並點擊「儲存偏好」</div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://rfzavcliggzlpkqqcrzr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmemF2Y2xpZ2d6bHBrcXFjcnpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzY1NjUsImV4cCI6MjA5MjY1MjU2NX0.PAPu8svIFjvDXUfY91yXGIRmktBCKExsOnqxlYW0z_I';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    // 顯示快取的使用者資訊
    function displayCachedUserInfo() {
        const userName = localStorage.getItem('loggedInUserName');
        const userEmail = localStorage.getItem('loggedInUserEmail');
        const nameDisplay = document.getElementById('user-name-display');
        const emailDisplay = document.getElementById('user-email-display');
        const navName = document.getElementById('nav-user-name');
        if (nameDisplay) nameDisplay.innerText = userName ? `${userName} 家長` : '';
        if (emailDisplay) emailDisplay.innerText = (userEmail && userEmail.trim()) ? userEmail : '';
        if (navName) navName.innerText = userName ? `👋 你好，${userName}` : '👋 你好，家長';
    }

    // 從資料庫載入基本資料（含電話）
    async function loadUserData() {
        const userId = localStorage.getItem('loggedInUserId');
        const userRole = localStorage.getItem('userRole');
        if (!userId || userRole !== 'parent') {
            alert('請先登入家長帳號！');
            window.location.href = 'login.html';
            return;
        }
        try {
            const { data, error } = await supabaseClient
                .from('parent')
                .select('name, email, phone')
                .eq('parent_id', parseInt(userId))
                .maybeSingle();
            if (error) throw error;
            if (data) {
                document.getElementById('name').value = data.name || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('phone').value = data.phone || '';
                // 更新 localStorage
                if (data.name) localStorage.setItem('loggedInUserName', data.name);
                if (data.email) localStorage.setItem('loggedInUserEmail', data.email);
                if (data.phone) localStorage.setItem('loggedInUserPhone', data.phone);
                displayCachedUserInfo();
            }
        } catch (err) {
            console.error('載入使用者資料失敗:', err);
            showBasicMessage('無法載入基本資料', 'error');
        }
    }

    // 儲存基本資料（含電話）
    async function saveProfile(event) {
        event.preventDefault();
        const userId = localStorage.getItem('loggedInUserId');
        const newName = document.getElementById('name').value.trim();
        const newEmail = document.getElementById('email').value.trim();
        const newPhone = document.getElementById('phone').value.trim();

        if (!newName) {
            showBasicMessage('請填寫姓名', 'error');
            return;
        }
        if (!newEmail || !/^\S+@\S+\.\S+$/.test(newEmail)) {
            showBasicMessage('請填寫有效的電子郵件', 'error');
            return;
        }
        try {
            const updateData = { name: newName, email: newEmail };
            if (newPhone) updateData.phone = newPhone;
            const { error } = await supabaseClient
                .from('parent')
                .update(updateData)
                .eq('parent_id', parseInt(userId));
            if (error) throw error;
            // 更新 localStorage
            localStorage.setItem('loggedInUserName', newName);
            localStorage.setItem('loggedInUserEmail', newEmail);
            if (newPhone) localStorage.setItem('loggedInUserPhone', newPhone);
            displayCachedUserInfo();
            showBasicMessage('✅ 基本資料已更新！', 'success');
        } catch (err) {
            console.error('儲存失敗:', err);
            showBasicMessage('儲存失敗，請稍後再試', 'error');
        }
    }

    function showBasicMessage(msg, type) {
        const div = document.getElementById('basic-message');
        div.innerHTML = `<div class="message ${type}">${msg}</div>`;
        setTimeout(() => div.innerHTML = '', 3000);
    }

    // 偏好設定相關功能（保持原有）
    function loadPreferencesFromStorage() {
        const pref = localStorage.getItem('parentPreferences');
        if (pref) {
            try {
                const p = JSON.parse(pref);
                if (p.district) document.getElementById('pref-district').value = p.district;
                if (p.category) document.getElementById('pref-category').value = p.category;
                if (p.evaluation) document.getElementById('pref-evaluation').value = p.evaluation;
                if (p.extended) document.getElementById('pref-extended').value = p.extended;
            } catch(e) { console.warn(e); }
        }
    }

    async function savePreferences(event) {
        event.preventDefault();
        const preferences = {
            district: document.getElementById('pref-district').value,
            category: document.getElementById('pref-category').value,
            evaluation: document.getElementById('pref-evaluation').value,
            extended: document.getElementById('pref-extended').value
        };
        localStorage.setItem('parentPreferences', JSON.stringify(preferences));
        showPrefMessage('✅ 偏好已儲存，正在更新推薦...', 'success');
        await updateRecommendations(preferences);
    }

    async function updateRecommendations(pref) {
        const listDiv = document.getElementById('recommend-list');
        listDiv.innerHTML = '<div class="no-data">⏳ 載入推薦中...</div>';
        let query = supabaseClient.from('childcare_centers').select('*');
        if (pref.district) query = query.eq('district', pref.district);
        if (pref.category) query = query.eq('category', pref.category);
        if (pref.extended !== '') {
            const extendedBool = pref.extended === 'true';
            query = query.eq('extended_care', extendedBool);
        }
        const { data: centers, error } = await query.limit(6);
        if (error || !centers || centers.length === 0) {
            listDiv.innerHTML = '<div class="no-data">沒有符合偏好的機構，試試放寬條件～</div>';
            return;
        }
        let filtered = centers;
        if (pref.evaluation) {
            const centerIds = centers.map(c => c.center_id);
            const { data: evals } = await supabaseClient
                .from('evaluation_record')
                .select('center_id, evalution_result')
                .in('center_id', centerIds)
                .order('completion_date', { ascending: false });
            const latestEval = {};
            if (evals) evals.forEach(e => { if (!latestEval[e.center_id]) latestEval[e.center_id] = e.evalution_result; });
            filtered = centers.filter(c => latestEval[c.center_id] === pref.evaluation);
        }
        if (filtered.length === 0) {
            listDiv.innerHTML = '<div class="no-data">沒有符合評鑑等級的機構</div>';
            return;
        }
        listDiv.innerHTML = filtered.map(center => `
            <div class="rec-card">
                <h4>🏫 ${center.name || '機構名稱'}</h4>
                <div class="detail">📍 ${center.district || ''} ${center.streetline || ''}</div>
                <div class="detail">⭐ 評鑑：請查看詳情</div>
                <div class="detail">📞 ${center.phone || '未提供'}</div>
                <div style="margin-top:10px;">
                    <a href="center-detail.html?id=${center.center_id}" class="wireframe-btn" style="text-decoration:none; font-size:12px;">查看詳情</a>
                </div>
            </div>
        `).join('');
    }

    function showPrefMessage(msg, type) {
        const div = document.getElementById('pref-message');
        div.innerHTML = `<div class="message ${type}">${msg}</div>`;
        setTimeout(() => div.innerHTML = '', 3000);
    }

    async function init() {
        displayCachedUserInfo();
        await loadUserData();
        loadPreferencesFromStorage();
        const pref = localStorage.getItem('parentPreferences');
        if (pref) {
            try {
                await updateRecommendations(JSON.parse(pref));
            } catch(e) { console.warn(e); }
        }
    }

    document.getElementById('profile-form').addEventListener('submit', saveProfile);
    document.getElementById('preference-form').addEventListener('submit', savePreferences);
    init();
</script>
</body>
</html>
