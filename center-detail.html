<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機構詳細資訊 - 托育資訊整合平台</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .detail-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .detail-header { background:#fff; border:2px solid #ccc; padding:30px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:flex-start; }
        .detail-title { margin-bottom:12px; }
        .detail-badge { background:#e0e0e0; padding:4px 12px; border:1px solid #999; font-size:13px; margin-right:8px; }
        .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
        .detail-card { background:#fff; border:2px solid #ccc; padding:20px; }
        .detail-card h3 { margin-bottom:15px; border-bottom:2px solid #eee; padding-bottom:8px; }
        .info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:14px; gap:10px; }
        .info-label { color:#666; white-space:nowrap; }
        .info-value { font-weight:bold; text-align:right; }
        .photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
        .photo-item { height:150px; background:#eaeaea; border:1px dashed #999; display:flex; align-items:center; justify-content:center; color:#999; overflow:hidden; }
        .photo-item img { width:100%; height:100%; object-fit:cover; }
        .staff-table { width:100%; border-collapse:collapse; font-size:14px; }
        .staff-table th, .staff-table td { padding:10px; border-bottom:1px solid #eee; text-align:left; }
        .staff-table th { background:#f9f9f9; color:#666; }
        .review-item { padding:15px 0; border-bottom:1px solid #eee; }
        .score-row { display:flex; gap:20px; flex-wrap:wrap; margin:8px 0; }
        .score-tag { font-size:13px; color:#555; }
        .score-tag span { font-weight:bold; color:#f59e0b; }
        .loading { text-align:center; padding:60px; color:#999; font-size:18px; }
        .full-card { margin-bottom:20px; }
        .review-form { background:#f8fafc; border:1px solid #e2e8f0; padding:20px; margin-top:20px; border-radius:8px; }
        .review-form h4 { margin-bottom:15px; color:#333; }
        .score-inputs { display:flex; flex-wrap:wrap; gap:20px; margin-bottom:20px; }
        .score-field { flex:1; min-width:150px; }
        .score-field label { display:block; font-size:14px; font-weight:bold; color:#555; margin-bottom:6px; }
        .score-field select { width:100%; padding:8px 12px; border:1px solid #ccc; border-radius:6px; font-size:14px; background:#fff; }
        .review-form textarea { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; resize:vertical; min-height:80px; margin-bottom:15px; }
        .review-form button { background:#666; color:#fff; border:none; padding:10px 20px; font-size:14px; font-weight:bold; border-radius:6px; cursor:pointer; transition:0.2s; }
        .review-form button:hover { background:#444; }
        #review-submit-result { margin-top:10px; font-size:14px; }
    </style>
</head>

<body>

<header class="navbar">
    <a href="index.html" style="text-decoration:none;"><div class="logo-placeholder">托育整合平台</div></a>
    <div class="nav-actions">
        <a href="search.html" class="wireframe-btn" style="text-decoration:none;">← 回搜尋結果</a>
        <a href="user.html" class="wireframe-btn primary" style="text-decoration:none;">我的會員區</a>
    </div>
</header>

<div class="detail-container">
    <div id="loading" class="loading">⏳ 載入機構資料中...</div>
    <div id="detail-content" style="display:none;">

        <div class="detail-header">
            <div>
                <h1 class="detail-title" id="center-name">-</h1>
                <div>
                    <span class="detail-badge" id="center-category">-</span>
                    <span class="detail-badge" id="center-operation">-</span>
                    <span class="detail-badge" id="center-district">-</span>
                </div>
            </div>
            <button class="wireframe-btn primary" onclick="addToFavorite()">❤️ 加入收藏</button>
        </div>

        <div class="detail-grid">
            <div class="detail-card">
                <h3>📋 基本資料</h3>
                <div class="info-row"><span class="info-label">地址</span><span class="info-value" id="center-address">-</span></div>
                <div class="info-row"><span class="info-label">電話</span><span class="info-value" id="center-phone">-</span></div>
                <div class="info-row"><span class="info-label">營業時間</span><span class="info-value" id="center-hours">-</span></div>
                <div class="info-row"><span class="info-label">師生比</span><span class="info-value" id="center-ratio">-</span></div>
                <div class="info-row"><span class="info-label">總收托容量</span><span class="info-value" id="center-capacity">-</span></div>
                <div class="info-row"><span class="info-label">負責人</span><span class="info-value" id="center-rep">-</span></div>
                <div class="info-row"><span class="info-label">立案資格</span><span class="info-value" id="center-qual">-</span></div>
            </div>
            <div class="detail-card">
                <h3>📝 招生狀態</h3>
                <div class="info-row"><span class="info-label">目前招生狀態</span><span class="info-value" id="enroll-accepting">-</span></div>
                <div class="info-row"><span class="info-label">候補人數</span><span class="info-value" id="enroll-waitlist">-</span></div>
                <div class="info-row"><span class="info-label">月費</span><span class="info-value" id="enroll-fee">-</span></div>
                <div class="info-row"><span class="info-label">服務時數</span><span class="info-value" id="enroll-hours">-</span></div>
                <div class="info-row"><span class="info-label">延托服務</span><span class="info-value" id="enroll-extended">-</span></div>
                <div class="info-row"><span class="info-label">最後更新</span><span class="info-value" id="enroll-updated">-</span></div>
            </div>
        </div>

        <div class="detail-card full-card">
            <h3>🖼️ 設施照片</h3>
            <div class="photo-grid" id="photo-grid"><div class="photo-item">載入中...</div></div>
        </div>

        <div class="detail-card full-card">
            <h3>👥 師資列表</h3>
            <table class="staff-table">
                <thead><tr><th>姓名</th><th>職稱</th><th>資格證照</th><th>簡介</th></tr></thead>
                <tbody id="staff-tbody"><tr><td colspan="4" style="text-align:center;color:#999;padding:20px;">載入中...</td></tr></tbody>
            </table>
        </div>

        <div class="detail-card full-card">
            <h3>🏅 政府評鑑紀錄</h3>
            <div id="evaluation-content"><p style="color:#999;text-align:center;">載入中...</p></div>
        </div>

        <div class="detail-card full-card">
            <h3>⭐ 家長評價與心得</h3>
            <div id="reviews-list"><p style="color:#999;text-align:center;padding:20px;">尚無評價</p></div>

            <div class="review-form" id="review-form" style="display:none;">
                <h4>✍️ 留下您的評價</h4>
                <div class="score-inputs">
                    <div class="score-field">
                        <label>師資品質</label>
                        <select id="score-staff">
                            <option value="">請選擇</option>
                            <option value="5">5 ⭐ 非常滿意</option>
                            <option value="4">4 ⭐ 滿意</option>
                            <option value="3">3 ⭐ 普通</option>
                            <option value="2">2 ⭐ 不滿意</option>
                            <option value="1">1 ⭐ 非常不滿意</option>
                        </select>
                    </div>
                    <div class="score-field">
                        <label>環境整潔</label>
                        <select id="score-env">
                            <option value="">請選擇</option>
                            <option value="5">5 ⭐ 非常滿意</option>
                            <option value="4">4 ⭐ 滿意</option>
                            <option value="3">3 ⭐ 普通</option>
                            <option value="2">2 ⭐ 不滿意</option>
                            <option value="1">1 ⭐ 非常不滿意</option>
                        </select>
                    </div>
                    <div class="score-field">
                        <label>課程活動</label>
                        <select id="score-curriculum">
                            <option value="">請選擇</option>
                            <option value="5">5 ⭐ 非常滿意</option>
                            <option value="4">4 ⭐ 滿意</option>
                            <option value="3">3 ⭐ 普通</option>
                            <option value="2">2 ⭐ 不滿意</option>
                            <option value="1">1 ⭐ 非常不滿意</option>
                        </select>
                    </div>
                </div>
                <textarea id="review-comment" placeholder="分享您對這間機構的心得（選填）..."></textarea>
                <button onclick="submitReview()">📤 送出評價</button>
                <div id="review-submit-result" style="margin-top:8px;font-size:14px;"></div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const API_BASE = 'http://localhost:3000/api'; 

    // Supabase 設定（用於查詢列表）
    const SUPABASE_URL = 'https://rfzavcliggzlpkqqcrzr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmemF2Y2xpZ2d6bHBrcXFjcnpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzY1NjUsImV4cCI6MjA5MjY1MjU2NX0.PAPu8svIFjvDXUfY91yXGIRmktBCKExsOnqxlYW0z_I';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const centerId = urlParams.get('id');

    const getUserId = () => localStorage.getItem('loggedInUserId');

    function formatTime(t) { return t ? t.slice(0,5) : '-'; }
    function formatDate(d) { return d ? d.slice(0,10) : '日期未提供'; }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m;
        });
    }

    async function loadCenterDetail() {
        if (!centerId) {
            document.getElementById('loading').innerText = '找不到機構 ID，請從搜尋頁進入。';
            return;
        }
        try {
            // 1. 機構基本資料：後端有此 API，正常抓取
            const res = await fetch(`${API_BASE}/childcare-centers/${centerId}`);
            if (!res.ok) throw new Error('找不到該機構');
            const centerResult = await res.json();
            const center = centerResult.data || centerResult;

            document.title = `${center.name} - 托育資訊整合平台`;
            document.getElementById('center-name').innerText = center.name || '-';
            document.getElementById('center-category').innerText = center.category || '-';
            document.getElementById('center-operation').innerText = center.operation_type || '-';
            document.getElementById('center-district').innerText = center.district || '-';
            document.getElementById('center-address').innerText = [center.city, center.district, center.streetline].filter(Boolean).join(' ') || '-';
            document.getElementById('center-phone').innerText = center.phone || '-';
            document.getElementById('center-hours').innerText = (center.open_time && center.close_time) ? `${formatTime(center.open_time)} - ${formatTime(center.close_time)}` : '-';
            document.getElementById('center-ratio').innerText = center.teacher_student_ratio ? `1 : ${center.teacher_student_ratio}` : '-';
            document.getElementById('center-capacity').innerText = center.total_capacity ? `${center.total_capacity} 人` : '-';
            document.getElementById('center-rep').innerText = center.representative || '-';
            document.getElementById('center-qual').innerText = center.qualification || '-';

            // 📖 2. 招生狀態 (退回用 Supabase 撈取)
            const { data: enrollment } = await supabaseClient.from('enrollment_status').select('*').eq('center_id', centerId).maybeSingle();
            if (enrollment) {
                document.getElementById('enroll-accepting').innerText = enrollment.is_accepting ? '✅ 開放招生中' : '❌ 暫停招生';
                document.getElementById('enroll-waitlist').innerText = enrollment.waitlist_count ?? '-';
                document.getElementById('enroll-fee').innerText = enrollment.monthly_fee ? `NT$ ${enrollment.monthly_fee.toLocaleString()}` : '-';
                document.getElementById('enroll-hours').innerText = enrollment.service_hour ? `${enrollment.service_hour} 小時` : '-';
                document.getElementById('enroll-extended').innerText = enrollment.extended_care ? '✅ 提供' : '❌ 不提供';
                document.getElementById('enroll-updated').innerText = formatDate(enrollment.updated_at);
            }

            // 📖 3. 設施照片 (退回用 Supabase 撈取)
            const { data: photos } = await supabaseClient.from('photo').select('*').eq('center_id', centerId);
            document.getElementById('photo-grid').innerHTML = (photos && photos.length > 0)
                ? photos.map(p => `<div class="photo-item"><img src="${p.url}" alt="${p.caption || '設施照片'}"></div>`).join('')
                : '<div class="photo-item" style="grid-column:1/-1;">尚無設施照片</div>';

            // 📖 4. 師資 (退回用 Supabase 撈取)
            const { data: staff } = await supabaseClient.from('staff').select('*').eq('center_id', centerId);
            const staffTbody = document.getElementById('staff-tbody');
            if (staff && staff.length) {
                staffTbody.innerHTML = staff.map(s => `<tr>
                    <td>${escapeHtml(s.name) || '-'}</td>
                    <td>${escapeHtml(s.role) || '-'}</td>
                    <td>${escapeHtml(s.qualification) || '-'}</td>
                    <td style="color:#666;">${escapeHtml(s.biography) || '-'}</td>
                </tr>`).join('');
            } else {
                staffTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;padding:20px;">尚無師資資料</td></tr>';
            }

            // 📖 5. 評鑑紀錄 (退回用 Supabase 撈取)
            const { data: evals } = await supabaseClient.from('evaluation_record').select('*').eq('center_id', centerId).order('completion_date', { ascending: false });
            const evalDiv = document.getElementById('evaluation-content');
            if (evals && evals.length) {
                evalDiv.innerHTML = evals.map(e => `
                    <div class="info-row">
                        <span class="info-label">📅 ${e.evaluation_academic_year || '-'} 學年度</span>
                        <span class="info-value">結果：${e.evalution_result || '-'}${e.completion_date ? `（完成日期：${formatDate(e.completion_date)}）` : ''}</span>
                    </div>
                    ${e.non_compliance_details ? `<div style="padding:8px 0;font-size:13px;color:#e74c3c;border-bottom:1px solid #f0f0f0;">⚠️ 缺失說明：${escapeHtml(e.non_compliance_details)}</div>` : ''}
                `).join('');
            } else {
                evalDiv.innerHTML = '<p style="color:#999;text-align:center;padding:10px;">尚無評鑑紀錄</p>';
            }

            // 6. 家長評價
            await loadReviews();

            // 7. 若已登入為家長，顯示評價表單
            const userId = getUserId();
            const userRole = localStorage.getItem('userRole');
            if (userId && userRole === 'parent') {
                document.getElementById('review-form').style.display = 'block';
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('detail-content').style.display = 'block';

        } catch (err) {
            console.error(err);
            document.getElementById('loading').innerText = '❌ 載入失敗，請稍後再試。';
        }
    }

    // 📖 讀取評價：(使用 Supabase 抓取，避開後端缺少的 GET 路由)
    async function loadReviews() {
        try {
            const { data: reviews } = await supabaseClient
                .from('reviews')
                .select('*')
                .eq('center_id', centerId)
                .order('created_at', { ascending: false });

            const reviewsDiv = document.getElementById('reviews-list');
            if (reviews && reviews.length) {
                reviewsDiv.innerHTML = reviews.map(r => `
                    <div class="review-item">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <strong style="color:#333; font-size:14px;">🕵️ 匿名家長</strong>
                            <div style="font-size:12px; color:#999;">${formatDate(r.created_at)}</div>
                        </div>
                        <div class="score-row">
                            <span class="score-tag">整體 <span>${r.score_overall ?? '-'}</span>/5</span>
                            <span class="score-tag">師資 <span>${r.score_staff ?? '-'}</span>/5</span>
                            <span class="score-tag">環境 <span>${r.score_environment ?? '-'}</span>/5</span>
                            <span class="score-tag">課程 <span>${r.score_curriculum ?? '-'}</span>/5</span>
                        </div>
                        <div style="margin-top:8px;font-size:14px;color:#333;">${escapeHtml(r.comment) || '（無文字評價）'}</div>
                    </div>
                `).join('');
            } else {
                reviewsDiv.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">尚無家長評價</p>';
            }
        } catch (e) {
            console.error('評價載入失敗', e);
            document.getElementById('reviews-list').innerHTML = '<p style="color:#999;text-align:center;padding:20px;">無法載入評價</p>';
        }
    }

    // 📤 送出評價：呼叫 Node.js 後端 API (POST /api/reviews)，藉此觸發算分邏輯
    async function submitReview() {
        const userId = getUserId();
        const resultDiv = document.getElementById('review-submit-result');

        const scoreStaff = parseInt(document.getElementById('score-staff').value);
        const scoreEnv = parseInt(document.getElementById('score-env').value);
        const scoreCurriculum = parseInt(document.getElementById('score-curriculum').value);
        const comment = document.getElementById('review-comment').value.trim();

        if (!scoreStaff || !scoreEnv || !scoreCurriculum) {
            resultDiv.innerText = '⚠️ 請填寫所有評分項目！';
            resultDiv.style.color = '#e74c3c';
            return;
        }

        if (!userId) {
            alert('登入狀態已失效，請重新登入');
            window.location.href = 'login.html';
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/reviews`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    parent_id: parseInt(userId), // 💡 沒用 Token，手動將 parent_id 交給後端
                    center_id: parseInt(centerId),
                    score_staff: scoreStaff,
                    score_environment: scoreEnv,
                    score_curriculum: scoreCurriculum,
                    comment: comment || null
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || '送出失敗');
            }

            resultDiv.innerText = '✅ 評價送出成功！';
            resultDiv.style.color = '#16a34a';

            // 清空表單
            document.getElementById('score-staff').value = '';
            document.getElementById('score-env').value = '';
            document.getElementById('score-curriculum').value = '';
            document.getElementById('review-comment').value = '';

            // 重新載入評價列表
            await loadReviews();
        } catch (err) {
            console.error('送出評價失敗:', err);
            resultDiv.innerText = `❌ ${err.message}`;
            resultDiv.style.color = '#e74c3c';
        }
    }

    // 💖 加入收藏：呼叫 Node.js 後端 API (POST /api/favorites)
    async function addToFavorite() {
        const userId = getUserId();
        const userRole = localStorage.getItem('userRole');
        
        if (!userId || userRole !== 'parent') {
            alert('請先登入家長帳號才能收藏！');
            window.location.href = 'login.html';
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/favorites`, { // 依據你後端 app.js，路徑應為 /api/favorites
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    parent_id: parseInt(userId), // 💡 沒用 Token，手動將 parent_id 交給後端
                    center_id: parseInt(centerId)
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                if (errData.error && errData.error.includes('重複') || response.status === 409) {
                    throw new Error('這間機構已在您的收藏清單中！');
                }
                throw new Error('收藏失敗，請稍後再試。');
            }

            alert('✅ 已加入收藏！');
        } catch (err) {
            console.error(err);
            alert(err.message);
        }
    }

    loadCenterDetail();
</script>
</body>
</html>
