<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的評鑑紀錄 - 托育資訊整合平台</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .user-layout { display: flex; max-width: 1200px; margin: 40px auto; gap: 30px; padding: 0 20px; }
        .user-sidebar { width: 250px; background-color: var(--surface-color); border: 1px solid var(--border-light); height: fit-content; }
        .user-profile-summary { padding: 20px; text-align: center; border-bottom: 2px solid #eee; }
        .avatar-placeholder { width: 80px; height: 80px; background-color: #ccc; border-radius: 50%; margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
        .user-menu { list-style: none; padding: 0; margin: 0; }
        .user-menu li { border-bottom: 1px solid var(--border-light); }
        .user-menu a { display: block; padding: 15px 20px; text-decoration: none; color: var(--text-main); font-weight: bold; }
        .user-menu a:hover, .user-menu a.active { background-color: #F2EFEB; border-left: 4px solid #666; }
        .user-main { flex-grow: 1; }
        .welcome-header { margin-bottom: 30px; padding-bottom: 10px; border-bottom: 1px solid var(--border-light); }
        .text-line { color: var(--text-muted); font-size: 14px; }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

        /* Modal 樣式 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background-color: var(--surface-color); max-width: 500px; width: 90%; padding: 25px; border: 1px solid var(--border-light); border-radius: var(--border-radius-lg); position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); padding-bottom: 10px; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; }
        .close-modal { font-size: 28px; font-weight: bold; cursor: pointer; color: #aaa; }
        .close-modal:hover { color: #000; }
        .score-inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .score-field label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .score-field select, .score-field textarea { width: 100%; padding: 8px; border: 1px solid var(--border-light); font-size: 14px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-footer button { padding: 8px 20px; cursor: pointer; }
    </style>
</head>
<body>

<header class="navbar">
    <a href="index.html" style="text-decoration: none;">
        <div class="logo-placeholder">托育整合平台</div>
    </a>
    <div class="nav-actions">
        <span id="nav-user-name">👋 你好，家長</span>
        <a href="index.html" class="wireframe-btn" style="text-decoration:none;">回首頁</a>
        <button class="wireframe-btn primary" onclick="logout()">登出</button>
    </div>
</header>

<div class="user-layout">
    <aside class="user-sidebar">
        <div class="user-profile-summary">
            <div class="avatar-placeholder">大頭貼</div>
            <h3 id="user-name-display"></h3>
            <div id="user-email-display" class="text-line"></div>
        </div>
        <ul class="user-menu">
            <li><a href="user.html">🏠 會員首頁概況</a></li>
            <li><a href="profile.html">👤 個人資料設定</a></li>
            <li><a href="favorite.html">📁 我的收藏清單</a></li>
            <li><a href="my-reviews.html" class="active">📝 我的評價紀錄</a></li>
        </ul>
    </aside>

    <main class="user-main">
        <div class="welcome-header">
            <h2>📝 我的評價紀錄</h2>
            <p class="text-line">您可以在這裡查看、修改或刪除您過去發布的所有機構評價。</p>
        </div>

        <div id="my-reviews-list" style="display: flex; flex-direction: column; gap: 15px;">
            <div class="empty-state">⏳ 正在載入您的評價資料...</div>
        </div>
    </main>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>✏️ 編輯評價</h3>
            <span class="close-modal" onclick="closeEditModal()">&times;</span>
        </div>
        <form id="editReviewForm">
            <div class="score-inputs">
                <div class="score-field">
                    <label>師資品質</label>
                    <select id="edit-score-staff" required>
                        <option value="">請選擇</option>
                        <option value="5">5 ⭐ 非常滿意</option>
                        <option value="4">4 ⭐ 滿意</option>
                        <option value="3">3 ⭐ 普通</option>
                        <option value="2">2 ⭐ 不滿意</option>
                        <option value="1">1 ⭐ 非常不滿意</option>
                    </select>
                </div>
                <div class="score-field">
                    <label>環境整潔</label>
                    <select id="edit-score-env" required>
                        <option value="">請選擇</option>
                        <option value="5">5 ⭐ 非常滿意</option>
                        <option value="4">4 ⭐ 滿意</option>
                        <option value="3">3 ⭐ 普通</option>
                        <option value="2">2 ⭐ 不滿意</option>
                        <option value="1">1 ⭐ 非常不滿意</option>
                    </select>
                </div>
                <div class="score-field">
                    <label>課程活動</label>
                    <select id="edit-score-curriculum" required>
                        <option value="">請選擇</option>
                        <option value="5">5 ⭐ 非常滿意</option>
                        <option value="4">4 ⭐ 滿意</option>
                        <option value="3">3 ⭐ 普通</option>
                        <option value="2">2 ⭐ 不滿意</option>
                        <option value="1">1 ⭐ 非常不滿意</option>
                    </select>
                </div>
            </div>
            <div class="score-field">
                <label>文字評論（選填）</label>
                <textarea id="edit-review-comment" rows="4" placeholder="分享您的詳細心得..."></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="wireframe-btn" onclick="closeEditModal()">取消</button>
                <button type="submit" class="wireframe-btn primary">儲存修改</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="my-reviews.js"></script>
</body>
</html>
